name: Release application
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a real, approved application and annotated tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          python3 scripts/manage.py check-release
          test -f tests/application-release.sh
      - run: sudo apt-get update && sudo apt-get install -y age shellcheck
      - run: shellcheck scripts/*.sh && python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 tests/compose_check.py
      - name: Application acceptance tests (must be implemented with the MVP)
        run: bash tests/application-release.sh
      - name: Read pinned build inputs
        id: inputs
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          m = json.load(open('deploy/application.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('sdk_image', 'runtime_image'):
                  print(f'{key}={m[key]}', file=out)
              print('revision=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), file=out)
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login with ephemeral GitHub token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/joseptomascomellas/ssh:${{ github.ref_name }}
          build-args: |
            SDK_IMAGE=${{ steps.inputs.outputs.sdk_image }}
            RUNTIME_IMAGE=${{ steps.inputs.outputs.runtime_image }}
            REVISION=${{ steps.inputs.outputs.revision }}
      - name: Publish draft release with exact source and deployment coordinates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir release-assets
          git archive --format=tar.gz -o release-assets/source.tar.gz HEAD
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          p = pathlib.Path('release-assets')
          manifest = dict(tag=os.environ['RELEASE_TAG'],
              commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              image='ghcr.io/joseptomascomellas/ssh@' + os.environ['IMAGE_DIGEST'],
              data_epoch=json.load(open('deploy/application.json'))['data_epoch'])
          (p / 'release.json').write_text(json.dumps(manifest, indent=2) + '\n')
          files = sorted(p.iterdir())
          (p / 'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest() + '  ' + f.name + '\n' for f in files))
          PY
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
      - name: Logout
        if: always()
        run: docker logout ghcr.io
