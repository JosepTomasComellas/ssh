services:
  app:
    image: ${APP_IMAGE:?An immutable image digest is required}
    user: "1654:1654"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080;9091"   # 9091 = gestió (mètriques): mai es publica
      DOTNET_EnableDiagnostics: "0"
      HOME: /tmp
      TZ: ${TZ:-Europe/Madrid}
      AllowedHosts: ${DOMAIN:?Set a domain}
      WebSsh__PublicUrl: https://${DOMAIN}
      WebSsh__TrustedProxies: ${TRUSTED_PROXIES:?Set exact proxy IP addresses}
      WebSsh__DataDirectory: /var/lib/web-ssh-terminal
      WebSsh__AppKeyFile: /run/secrets/app_key
      WebSsh__BootstrapPasswordFile: /run/secrets/bootstrap_password
      WebSsh__SshCredentialsFile: /run/secrets/ssh_credentials
      WebSsh__KnownHostsFile: /run/secrets/known_hosts
      WebSsh__SshHost: ${SSH_HOST:?Set the single SSH server host}
      WebSsh__SshPort: ${SSH_PORT:-22}
      WebSsh__MetricsPort: "9091"
      WebSsh__SourceUrl: ${SOURCE_URL:?Set source revision URL}
    volumes:
      - type: bind
        source: ${DATA_DIR:?Set persistent data directory}
        target: /var/lib/web-ssh-terminal
        bind:
          create_host_path: false
    secrets: [app_key, bootstrap_password, ssh_credentials, known_hosts]
    healthcheck:
      test: [CMD, /app/WebSshTerminal, --healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [backend]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
secrets:
  app_key:
    file: ${SECRETS_DIR:?Set secrets directory}/app_key
  bootstrap_password:
    file: ${SECRETS_DIR}/bootstrap_password
  ssh_credentials:
    file: ${SECRETS_DIR}/ssh_credentials
  known_hosts:
    file: ${SECRETS_DIR}/known_hosts
networks:
  backend:
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:?Set a non-conflicting Docker subnet}
