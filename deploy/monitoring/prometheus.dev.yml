# Prometheus PRIVAT per a desenvolupament/demo (perfil «monitoring» del Compose local).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: web-ssh-terminal
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["app:9091"]
