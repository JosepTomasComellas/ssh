# NGINX LOCAL DE DESENVOLUPAMENT. Certificat autosignat de .dev/certs: NO el reutilitzis en producció.
# La plantilla de producció és deploy/nginx/webssh.conf.template.
map $http_upgrade $webssh_connection {
    default upgrade;
    '' close;
}
log_format webssh_metadata '$remote_addr $request_method $status $body_bytes_sent';

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    ssl_certificate /certs/dev.crt;
    ssl_certificate_key /certs/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /dev/stdout webssh_metadata;
    error_log /dev/stderr warn;
    client_max_body_size 20m;

    location / {
        proxy_pass http://172.29.0.20:8080;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $webssh_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }
}
